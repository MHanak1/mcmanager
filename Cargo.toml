[package]
name = "mcmanager"
version = "0.2.0"
edition = "2024"

[lints.clippy]
uninlined_format_args = "warn"
unused_async = "warn"
if_not_else = "warn"
default_trait_access = "warn"
manual_string_new = "warn"
manual_find = "warn"
needless_pass_by_value = "warn"

[dependencies]
any_ascii = "0.3.3"
arc-swap = "1.8.2"
argon2 = "0.5.3"
async-trait = "0.1.89"
clap = { version = "4.5.60", features = ["derive"] }
color-eyre = "0.6.5"
config = "0.15.19"
console-subscriber = "0.5.0"
dialoguer = "0.12.0"
log = "0.4.29"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
pretty_assertions = "1.4.1"
regex = "1.12.3"
requestty = "0.6.3"
ron = "0.12.0"
serde = "1.0.228"
serde_ini = "0.2.0"
serde_json = "1.0.149"
serde_json5 = "0.2.1"
serde_with = { version = "3.17.0", features = ["macros"] }
serde_yaml = "0.9.34"
smart-default = "0.7.1"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.0.3"
tracing = "0.1.44"
tracing-subscriber = { version =  "0.3.22", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4", "v7"] }
validator = { version = "0.20.0", features = ["derive"] }

[dependencies.sea-orm]
version = "2.0.0-rc.36"
features = [
    "sqlx-sqlite",
    "sqlx-mysql",
    "sqlx-postgres",
    "runtime-tokio",
    "macros",
#    "seaography",
    "schema-sync",
    "entity-registry",
    "with-chrono",
    "with-uuid"
]
